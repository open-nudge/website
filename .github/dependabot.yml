# Weekly updates, one pull request per ecosystem (every dependency in a single
# group; security updates still come on their own). `cooldown` waits 7 days
# after a release before proposing it (supply-chain hardening). `fix` commit
# prefix: pull request titles pass the Pull Request check (pull-request.yml).
# prek hooks are updated by prek itself (prek.toml, `npm run update:hooks`).

---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    # @astrojs/check (latest 0.9.12) peers typescript ^5 || ^6; drop this
    # once a release accepts TypeScript 7
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix"
    groups:
      actions:
        patterns:
          - "*"
...
