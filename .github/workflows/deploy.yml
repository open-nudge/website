# Builds the site on every push and pull request; deploys `main` to GitHub Pages
# and releases the deployed commit as the next vX.Y.Z (conventional commits).
# Actions are pinned to commit SHAs (Dependabot keeps them up to date).

---
name: "deploy"

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

# enq: GitHub accepts only an empty mapping to drop all default permissions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read" # checkout of the repository
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            github.com:443
            registry.npmjs.org:443

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: "Install dependencies"
        run: "npm ci"

      - name: "Check types and content"
        run: "npm run check"

      - name: "Test content rendering"
        run: "npm test"

      - name: "Build"
        run: "npm run build"

      - name: "Upload site"
        if: "github.event_name != 'pull_request'"
        uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
        with:
          path: "dist"

  deploy:
    name: "Deploy"
    needs: "build"
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      pages: "write" # publish the site to GitHub Pages
      id-token: "write" # OIDC token that proves the deployment's origin to Pages
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443

      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1

  # Version lives in tags only: main accepts squash-merged pull requests, so
  # no bump can be committed back (package.json stays 0.0.0)
  release:
    name: "Release"
    needs: "deploy"
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    permissions:
      contents: "write" # create the vX.Y.Z tag and its GitHub release
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          disable-sudo-and-containers: true
          egress-policy: "block"
          allowed-endpoints: >
            api.github.com:443

      # Commits since the latest vX.Y.Z tag (or all of them, starting from
      # 0.0.0): `!` or BREAKING CHANGE bumps major, feat minor, fix patch
      - name: "Compute version"
        env:
          GH_TOKEN: "${{ github.token }}"
        # enq: shell indentation is more readable
        # yamllint disable rule:indentation rule:line-length
        run: |
          number='(0|[1-9][0-9]*)'
          latest="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" \
              --jq '.[].ref | ltrimstr("refs/tags/v")' \
              | { grep -E "^${number}\.${number}\.${number}$" || true; } \
              | sort -V \
              | tail -n 1
          )"
          # Bump of a commit message: 3 major, 2 minor, 1 patch, 0 none
          level='
            (split("\n")[0]) as $header
            | if ($header | test("^[a-z]+([(][^)]*[)])?!: "))
                or test("(^|\n)BREAKING[ -]CHANGE: ") then 3
              elif ($header | test("^feat([(][^)]*[)])?: ")) then 2
              elif ($header | test("^fix([(][^)]*[)])?: ")) then 1
              else 0 end'
          if [[ -n "${latest}" ]]; then
            levels="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/v${latest}...${GITHUB_SHA}" \
                --jq ".commits[].commit.message | ${level}"
            )"
          else
            levels="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/commits?sha=${GITHUB_SHA}&per_page=100" \
                --jq ".[].commit.message | ${level}"
            )"
          fi
          bump="$(sort -n <<< "${levels}" | tail -n 1)"
          IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
          case "${bump:-0}" in
            3) major=$((major + 1)); minor=0; patch=0 ;;
            2) minor=$((minor + 1)); patch=0 ;;
            1) patch=$((patch + 1)) ;;
            *)
              echo "::notice title=No release::No feat, fix or breaking commits since v${latest:-0.0.0}"
              exit 0
              ;;
          esac
          echo "TAG=v${major}.${minor}.${patch}" >> "${GITHUB_ENV}"
        # yamllint enable rule:indentation rule:line-length

      # Creates the tag too; fails if it exists or violates the tag rulesets
      - name: "Create release"
        if: "env.TAG != ''"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: >
          gh release create "${TAG}" --target "${GITHUB_SHA}"
          --title "${TAG}" --generate-notes --latest
...
