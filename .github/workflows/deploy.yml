# Builds the site on every push and pull request; deploys `main` to GitHub Pages.
# Actions are pinned to commit SHAs (Dependabot keeps them up to date).

---
name: "deploy"

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

# enq: GitHub accepts only an empty mapping to drop all default permissions
permissions: {} # yamllint disable-line rule:braces

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read" # checkout of the repository
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          egress-policy: "audit"

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: "Install dependencies"
        run: "npm ci"

      - name: "Check types and content"
        run: "npm run check"

      - name: "Test content rendering"
        run: "npm test"

      - name: "Build"
        run: "npm run build"

      - name: "Upload site"
        if: "github.event_name != 'pull_request'"
        uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
        with:
          path: "dist"

  deploy:
    name: "Deploy"
    needs: "build"
    if: "github.event_name != 'pull_request' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      pages: "write" # publish the site to GitHub Pages
      id-token: "write" # OIDC token that proves the deployment's origin to Pages
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: "Harden runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          egress-policy: "audit"

      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1
...
