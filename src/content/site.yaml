template:
  eyebrow: "start here"
  action: "use this template"
  url: "https://github.com/new?template_owner=open-nudge&template_name=opentemplate"
  text: >-
    A new Python repository whose releases you can prove: SLSA Build and Source L3, attested SBOMs,
    seven security scanners and hardened CI, on from the first commit. Around 100 workflows you
    don't have to write. Every other opennudge project is built from it.
  features:
    - title: "SLSA Build L3"
      text: >-
        Wheels and sdists are built by a reusable workflow that runs no project code, and attested
        in a separate job.
    - title: "SLSA Source L3"
      text: >-
        Every `main` commit gets signed source provenance (public repositories); a release below L3
        fails.
    - title: "verified, not just signed"
      text: "A Verification Summary Attestation records the SLSA level each release reached."
    - title: "attested SBOMs"
      text: >-
        CycloneDX SBOMs per Python version, OS and dependency group, plus GitHub Actions and REUSE
        ones.
    - title: "scanned before it ships"
      text: >-
        uv audit, Trivy, Semgrep, GuardDog, zizmor, CodeQL and trufflehog; their reports are
        attested and attached.
    - title: "immutable releases"
      text: >-
        A release stays a draft until every check passes. Once published, its assets and tag can't
        change.
    - title: "hardened CI"
      text: >-
        Pinned actions, least-privilege tokens, an egress allow-list, and OpenSSF Scorecard every week.
    - title: "one workflow to harden"
      text: "`harden.yml` switches on rulesets, signed commits, required reviews and immutable releases."
  verify:
    title: "Don't take our word for it."
    text: "Every release asset can be checked against the opentemplate workflow that built it:"
    command: |-
      gh attestation verify project-1.0.0-py3-none-any.whl \
      --repo you/project \
      --signer-workflow open-nudge/opentemplate/.github/workflows/_release-build.yml
agents:
  eyebrow: "for agents"
  title: "agent-ready"
  text: >-
    Every linter built with [lintkit](#lintkit) has an `mcp` command. Add [pynudger](#pynudger) to
    Claude Code, Cursor or any other MCP client, and your agent checks and fixes its own code while
    it writes. Fewer review rounds: you only see code that already passes.
  note: "Agents can also read [/llms.txt](/llms.txt), a plain-text map of this site."
  commandLabel: "start the MCP server"
  configLabel: "or in your MCP client config"
