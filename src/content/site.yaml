template:
  tab: "start here"
  eyebrow: "start here"
  action: "use this template"
  url: "https://github.com/new?template_owner=open-nudge&template_name=opentemplate"
  text: |-
    Create a new Python project with everything included (SLSA Build L3, attested SBOMs,
    hardening and security scanners).

    __You just code and commit__. Our checks take care of the rest.
  # phones (max-width: 40rem) show this instead of `text`
  phone:
    text: |-
      Create a new Python project with everything included
      (SLSA Build L3, attested SBOMs, hardening, multiple security scanners).

      - __You__ code, commit, do what you love
      - __We__ make sure everything goes smoothly
  verify:
    title: "Don't take our word for it."
    text: "Every release asset can be checked against the workflow that built it:"
    # note: the indented arguments are part of the command
    # yamllint disable rule:indentation
    command: |-
      gh attestation verify your-project-1.0.0-py3-none-any.whl --repo you/project \
        --signer-workflow open-nudge/opentemplate/.github/workflows/_release-build.yml
    # phones: one argument per line, the long path split into variables
    phoneCommand: |-
      repo=open-nudge/opentemplate
      workflows=.github/workflows

      gh attestation verify \
        your-project-1.0.0-py3-none-any.whl \
        --repo you/project \
        --signer-workflow \
        "$repo/$workflows/_release-build.yml"
    # yamllint enable rule:indentation
agents:
  tab: "for agents"
  title: "nudge your agents"
  text: |-
    Every linter built with [`lintkit`](#lintkit) has an `mcp` subcommand. Add [`pynudger`](#pynudger) to
    your harness and __your agents can__:
    - __validate code__
    - __read rule descriptions__
    - __check positive and negative usage examples__
  # phones (max-width: 40rem) show this instead of `text`
  phone:
    text: |-
      Every linter built with [`lintkit`](#lintkit) has an `mcp` subcommand. Add [`pynudger`](#pynudger) to
      your harness and __your agents can__:
      - __validate code__
      - __read rule descriptions__
      - __check usage examples__
  # desktop only
