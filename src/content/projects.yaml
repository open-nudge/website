#
# Open source projects shown on the home page, in the order of this file.
#
# name:                     # the key: project, repository and PyPI name
#   description: "..."      # required: Markdown prose (use |- for paragraphs/lists)
#   group: "linters"        # required: linters | automation | pytorch (src/content/site.yaml)
#   tags:                   # short labels shown as pills
#     - "CLI"
#   install: "name[all]"    # PyPI requirement, shown as `uv add` / `pip install`
#   steps:                  # instead of `install`: numbered steps (Markdown allowed)
#     - "..."
#   mcp: true               # `name mcp` starts an MCP server (needs the [mcp] extra)
#   featured: true          # the large "start here" block (one project)
#   phone:                  # featured only: phones show these instead of `steps` / `tags`
#     steps: ["..."]
#     tags: ["..."]
#   hidden: true            # kept here, but not shown anywhere
#
# Links are derived from the name; set `repo`, `docs` or `pypi` only when they differ:
#   repo: https://github.com/open-nudge/<name>
#   docs: https://open-nudge.github.io/<name>/
#   pypi: https://pypi.org/project/<name>/ (only with `install`)

---
opentemplate:
  description: "All-in-one, modern and secure Python template."
  group: "automation"
  featured: true
  steps:
    - "click `use this template` and add a description"
    - "wait for the automated setup workflow to finish"
    - "clone it and run `uv run poe setup`"
    - "follow the issue it opens to harden the repository"
  tags:
    - "GitHub template"
    - "uv"
    - "prek"
    - "OSSF"
    - "versioning"
    - "releasing"
  # phones (max-width: 40rem) show these instead of `steps` and `tags`
  phone:
    steps:
      - "click `use this template`"
      - "wait for the setup workflow"
      - "clone and run `uv run poe setup`"
    tags:
      - "GitHub template"
      - "uv"
      - "prek"
      - "OSSF"
      - "releasing"

lintkit:
  description: "Create linters in ~20 lines of Python. Lint Python, YAML, JSON and TOML."
  group: "linters"
  install: "lintkit[all]"
  tags:
    - "framework"
    - "noqa support"
    - "MCP"

pynudger:
  description: "Semantic linter - Python code quality rules for humans and agents."
  group: "linters"
  install: "pynudger[all]"
  mcp: true
  tags:
    - "naming"
    - "refactoring"
    - "modularization"

noqaexplain:
  description: "Every ignored lint rule needs a written explanation above it."
  group: "linters"
  install: "noqaexplain[all]"
  # mcp: true  # has one, left out of the agent-ready section for now
  tags:
    - "customizable"
    - "10+ linters supported"

pratidoc:
  description: "Lint your repository docs. Ensure the essentials are always there."
  group: "linters"
  hidden: true
  install: "pratidoc"
  tags:
    - "CLI"
    - "pre-commit hook"
    - "repo-wide"

loadfig:
  description: >-
    Load your config from pyproject.toml in one line, with automatic discovery.
  group: "automation"
  install: "loadfig"
  tags:
    - "multiconfig"
    - "git-aware"
    - "Python only"

comver:
  description: "Always-correct semantic versioning based on commits (no tags needed)."
  group: "automation"
  install: "comver"
  tags:
    - "CLI"
    - "plugin"
    - "hatch"
    - "verification"

cogeol:
  description: "Always up-to-date Python versions in pyproject.toml and CI (hook included)."
  group: "automation"
  install: "cogeol"
  tags:
    - "SPEC0"
    - "cog-based"
    - "endoflife.date"

torchlayers:
  description: "Shape and dimension inference (Keras-like) for PyTorch layers and neural networks."
  group: "pytorch"
  hidden: true
  install: "torchlayers"
  tags:
    - "shape inference"
    - "custom layers"

torchdatasets:
  description: "PyTorch datasets extended with map, cache and more (tf.data-like)."
  group: "pytorch"
  hidden: true
  install: "torchdatasets"
  tags:
    - "map / filter / cache"
    - "input pipelines"
...
