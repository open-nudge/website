# Licensing of files that cannot carry a header (https://reuse.software).
# Everything else carries its own SPDX header or a .license file next to it.
version = 1

# opennudge logo, mark, icons and social image: not Apache-2.0, all rights
# reserved (LICENSES/LicenseRef-opennudge-brand.txt, usage in BRAND.md)
[[annotations]]
path = [
  "public/brand/**",
  "src/assets/brand/**",
  "public/favicon.ico",
  "public/favicon.svg",
  "public/apple-touch-icon.png",
  "public/og.png",
]
SPDX-FileCopyrightText = "© 2026 open-nudge <https://github.com/open-nudge>"
SPDX-License-Identifier = "LicenseRef-opennudge-brand"

# Served as-is, a comment header would be served too
[[annotations]]
path = "public/robots.txt"
SPDX-FileCopyrightText = "© 2026 open-nudge <https://github.com/open-nudge>"
SPDX-License-Identifier = "Apache-2.0"
